name: Java CI with Maven

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.6-eclipse-temurin-21
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Give execute permission to mvnw
        run: chmod +x mvnw
      - name: Build project
        run: ./mvnw clean package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-files
          path: ./target/*.jar

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=auto --sarif --output=results.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  dependency-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Create report directory
        run: mkdir -p report

      - name: Run Dependency Check
        run: |
          docker run --rm \
            -v $(pwd):/src \
            -v ~/.m2/repository/org/owasp/dependency-check-data:/src/.dependency-check \
            owasp/dependency-check \
            --scan /src \
            --format HTML \
            --out /src/report \
            --suppression /src/dependency-check-suppression.xml \
            --failOnCVSS 0 \
            --retry 5 \
            --nvdDelay 60000

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: report/dependency-check-report.html